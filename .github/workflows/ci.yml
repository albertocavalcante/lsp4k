name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Linux multiplatform checks
  linux:
    name: Linux Check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check
        run: ./gradlew check -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false

      - name: Inspect local publication model
        run: tools/ci/check-publication-model.sh

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7

  # ===========================================================================
  # macOS Apple Native Check
  # ===========================================================================
  macos:
    name: macOS Native Check
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true

      - name: Show Xcode
        run: xcrun xcodebuild -version

      - name: Check Apple targets
        run: ./gradlew check -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=true

  # ===========================================================================
  # Coverage Report
  # ===========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: linux
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Kover Coverage Report
        run: ./gradlew koverHtmlReport koverXmlReport -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false

      - name: Kover Coverage Verify
        run: ./gradlew koverVerify -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 7

  java17-consumer:
    name: Published Java 17 consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k
      - name: Set up Java 17 and 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Verify Java 17 artifact consumer
        env:
          LSP4K_VERIFY_JAVA17: 'true'
        run: tools/ci/check-publication-model.sh

  # ===========================================================================
  # Windows x64 native tests
  # ===========================================================================
  windows:
    name: Windows Native Tests
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run mingwX64 native tests
        shell: bash
        run: ./gradlew mingwX64Test -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false --console=plain

      - name: Upload mingwX64 test executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-x64-test-executables
          path: 'lsp4k-*/build/bin/mingwX64/debugTest/test.exe'
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Linux ARM64: Kotlin/Native has no linux-aarch64 host, so the linuxArm64 test
  # executables are cross-linked on x64 and run on an ARM64 runner.
  # ===========================================================================
  linux-arm64-build:
    name: Linux ARM64 Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Link linuxArm64 test executables
        run: ./gradlew linkDebugTestLinuxArm64 -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false --console=plain

      - name: Upload linuxArm64 test executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-test-executables
          path: 'lsp4k-*/build/bin/linuxArm64/debugTest/test.kexe'
          if-no-files-found: error
          retention-days: 1

  linux-arm64:
    name: Linux ARM64 Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: linux-arm64-build
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK 17 (aarch64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify ARM64 host
        run: |
          uname -m
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.version '

      - name: JVM and Node.js tests
        run: ./gradlew jvmTest jsNodeTest -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false --continue --console=plain

      - name: Download linuxArm64 test executables
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-test-executables

      - name: Run linuxArm64 native tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for exe in lsp4k-*/build/bin/linuxArm64/debugTest/test.kexe; do
            [ -e "$exe" ] || continue
            found=$((found + 1))
            module="${exe%%/*}"
            chmod +x "$exe"
            file "$exe"
            echo "::group::$module test.kexe"
            (cd "$module" && ./build/bin/linuxArm64/debugTest/test.kexe)
            echo "::endgroup::"
          done
          test "$found" -ge 3

  # ===========================================================================
  # Windows ARM64: JVM and Node.js run natively. Kotlin/Native has no Windows
  # ARM64 target, so the mingwX64 executables from the x64 job run under x64
  # emulation.
  # ===========================================================================
  windows-arm64:
    name: Windows ARM64 Tests
    runs-on: windows-11-arm
    timeout-minutes: 40
    needs: windows
    permissions:
      contents: read

    steps:
      - name: Checkout lsp4k
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./.github/actions/checkout-jsonrpc4k

      - name: Set up JDK 17 (aarch64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: microsoft

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify ARM64 host
        shell: bash
        run: |
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.version '

      - name: JVM and Node.js tests
        shell: bash
        run: ./gradlew jvmTest jsNodeTest -Plsp4k.jsonrpc4kBuild=jsonrpc4k -Plsp4k.enableAppleTargets=false --continue --console=plain

      - name: Show failed tests
        if: failure()
        shell: bash
        run: grep -h -A12 '<failure' lsp4k-*/build/test-results/*/*.xml | head -150 || true

      - name: Download mingwX64 test executables
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mingw-x64-test-executables

      - name: Run mingwX64 native tests (x64 emulation)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for exe in lsp4k-*/build/bin/mingwX64/debugTest/test.exe; do
            [ -e "$exe" ] || continue
            found=$((found + 1))
            module="${exe%%/*}"
            echo "::group::$module test.exe"
            (cd "$module" && ./build/bin/mingwX64/debugTest/test.exe)
            echo "::endgroup::"
          done
          test "$found" -ge 3
